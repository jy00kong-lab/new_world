<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health Record Mock</title>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f5f5f5;
        }
        .wrap {
            max-width: 420px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        h1 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #222;
            margin: 0 0 20px;
        }
        .btn-link {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: #1a73e8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }
        .btn-link:active {
            opacity: 0.92;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Health Record Mock</h1>
    <button type="button" class="btn-link" id="linkHealthRecords">Link with Health Records</button>
</div>
<script>
    (function () {
        var WALGREENS_DEEPLINK = 'https://shealth.samsung.com/deepLink?sc_id=app.main&action=view&destination=web.service&provider_id=com.walgreens&service_id=com.walgreens.vaccines&param1=1234';
        document.getElementById('linkHealthRecords').addEventListener('click', function () {
            window.location.href = WALGREENS_DEEPLINK;
        });
    })();
</script>
</body>
</html>
