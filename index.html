<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health Match Mock</title>
    <style>
        html, body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
        h1 {
            margin: 0 0 16px;
            font-size: 1.25rem;
            font-weight: 600;
        }
        #activateStatus {
            margin-top: 12px;
            word-wrap: break-word;
        }
    </style>
    <script>
        var WebServiceJs = window.samsunghealth_service_webservice
    </script>
</head>

<body>
    <h1>Health Match Mock</h1>
    <button type="button" onclick="activate()">Service Activation</button>
    <p id="activateStatus"></p>

    <script>
        var testServiceInfo = {
            "providerId": "com.walgreens",
            "serviceId": "com.walgreens.vaccines",
            "serviceInfo": {
                "resourceInfo": {
                    "templateType": 0,
                    "contentUrl": "file:///android_asset/hwebview_test_service.html",
                    "data": {
                        "serviceIconUrl": "https://content.samsungknowledge.com/card/2017/6/image/original/qke9d8dd2d-c851-42a1-a9f9-6e4957d858ca.jpg",
                        "partnerName": "Sample Partner",
                        "serviceName": "Sample WebService",
                        "description": "This is template type 0. Activated.",
                        "ttsDesc": "Sample TTS Desc",
                        "buttonList": [{
                            "title": "button",
                            "actionUrl": "",
                            "ttsDesc": "sample tts for button"
                        }, {
                            "title": "button1",
                            "actionUrl": "",
                            "ttsDesc": "sample tts for button",
                            "extra": "{\"version\":1, \"btType\":\"reservation\", \"flag\":true}"
                        }],
                        "insight": {
                            "title": "insight title",
                            "description": "insight description",
                            "imgUrl": "https://content.samsungknowledge.com/card/2017/6/image/original/qke9d8dd2d-c851-42a1-a9f9-6e4957d858ca.jpg",
                            "actionUrl": ""
                        },
                        "bgImgUrl": "https://api-mock.test.samsungknowledge.com/static/images/health-hub-intro-image.webp",
                    },
                },
                "deactivationUrl": "https://www.google.co.kr/",
                "deactivationApi": "https://www.google.co.kr/",
                "serviceDataApi": "https://www.google.co.kr/",
                "serviceName": "test service card",
                "serviceVersion": "1"
            }
        }

        var ACTIVATE_REDIRECT_URL = 'https://jy00kong-lab.github.io/new_world/phr_side_mock.html';

        function activate() {
            var serviceDataString = JSON.stringify(testServiceInfo);
            WebServiceJs.activate(serviceDataString, "activateCallback");
        }

        function activateCallback(resultCode, deviceId) {
            document.getElementById('activateStatus').textContent =
                'resultCode:' + resultCode + ',deviceId:' + deviceId;
            window.location.href = ACTIVATE_REDIRECT_URL;
        }
    </script>
</body>

</html>
